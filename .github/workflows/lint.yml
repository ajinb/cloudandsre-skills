name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint skills (Agent Skills spec, repo rules, example contracts)
        run: python scripts/lint_skills.py
      - name: Offline evals (golden fixtures vs schemas and guardrails)
        run: cloudandsre-skills-eval
      - name: Ruff
        run: ruff check src tests scripts
      - name: Tests (incl. MCP server via in-memory client)
        run: pytest -q
