[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudandsre-skills"
version = "1.1.0"
description = "Production-shaped Agent Skills for SRE and cloud-reliability work, with output contracts, an eval harness and an MCP server."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["agent-skills", "mcp", "sre", "claude", "prompts", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pyyaml>=6", "jsonschema>=4.23"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
live = ["anthropic>=2.4,<3"]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.16,<0.18", "mcp>=2.3,<3"]

[project.scripts]
cloudandsre-skills-lint = "cloudandsre_skills.lint:main"
cloudandsre-skills-eval = "cloudandsre_skills.evals:main"
cloudandsre-skills-mcp = "cloudandsre_skills.mcp_server:main"

[project.urls]
Homepage = "https://cloudandsre.com"
Source = "https://github.com/ajinb/cloudandsre-skills"
Issues = "https://github.com/ajinb/cloudandsre-skills/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudandsre_skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "cloudandsre_skills/skills"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
